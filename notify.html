<style>
/* Container spacing */
.email-signup {
  margin: 1.5rem 0;
}

/* You can remove this if you already have a button style you like */
.email-signup__toggle {
  cursor: pointer;
}

/* Box that appears when toggled */
.email-signup__box {
  margin-top: 0.75rem;
}

/* Layout for input + button */
.email-signup__row {
  display: flex;
  gap: 0.5rem;
  align-items: stretch;
}

/* Keep these very generic; your global styles can override if needed */
.email-signup__input {
  flex: 1;
}

.email-signup__submit {
  cursor: pointer;
}

/* Optional: stack vertically on small screens */
@media (max-width: 600px) {
  .email-signup__row {
    flex-direction: column;
  }

  .email-signup__submit {
    width: 100%;
  }
}
.email-signup__input {
  flex: 1;
  padding: 0.75rem 1rem;
  font-size: 1rem;

  /* Base look */
  background: #ffffff;
  color: #111827;
  border: 2px solid #e5e7eb; /* light gray */
  border-radius: 8px;

  /* Transitions */
  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    transform 0.15s ease;
}

/* Placeholder color */
.email-signup__input::placeholder {
  color: #9ca3af;
}

/* Hover (optional—feels more responsive) */
.email-signup__input:hover {
  border-color: #d1d5db; /* slightly darker gray */
}

/* Focus state — thick bright pink */
.email-signup__input:focus {
  border-color: #ff2fa3; /* bright pink */
  box-shadow: 0 0 0 3px rgba(255, 47, 163, 0.25);
  transform: translateY(-1px);
}


.email-signup__submit:hover {
  filter: brightness(1.05);
  transform: translateY(-1px);
}

/* Active – subtle press */
.email-signup__submit:active {
  transform: translateY(0);
  filter: brightness(0.95);
}
</style>
	
	
	
	<!-- Email signup block -->
<section class="email-signup">
  <!-- Toggle button (use your existing button classes here if you want) -->
  <button
    type="button"
    id="email-signup-toggle"
    class="email-signup__toggle"
  >
    Join the list
  </button>

  <!-- Hidden form -->
  <div
    id="email-signup-box"
    class="email-signup__box"
    hidden
  >
    <form
      action="https://script.google.com/macros/s/AKfycbzriidi5iCWfptfNuQLIALN_O7s98vXR2pWb5-mdQjoJGb7JZC_gKYG9bxo1QATaQM/exec"
      method="POST"
      class="email-signup__form"
    >
      <label class="email-signup__label" for="email-signup-input">
        Email address
      </label>

      <div class="email-signup__row">
        <input
          id="email-signup-input"
          type="email"
          name="email"
          autocomplete="email"
          required
          class="email-signup__input"
          placeholder="you@example.com"
        />
<button
  type="button"
  id="email-signup-toggle"
  class="email-signup__toggle"
  style="padding:0; border:none; background:none; cursor:pointer;"
>
  <img
    src="https://raw.githubusercontent.com/monapdx/AbortOurCourt/refs/heads/main/images/branding/join-waitlist.png"
    alt="Join the list"
    style="width:150px; height:auto;"
  >
</button>

      </div>
    </form>
  </div>
</section>
<script>
  (function () {
    const toggle = document.getElementById("email-signup-toggle");
    const box = document.getElementById("email-signup-box");

    if (!toggle || !box) return;

    toggle.addEventListener("click", function () {
      const isHidden = box.hasAttribute("hidden");
      if (isHidden) {
        box.removeAttribute("hidden");
      } else {
        box.setAttribute("hidden", "");
      }
    });
  })();
</script>
