<head>
  <meta charset="utf-8" />

  <style>
    /* ===== Base / Reset ===== */
    :root {
      --brand:#ed0d92;
      --bg:#0b0f39;
      --bg-elev:#11122a;
      --text:#e9e9ef;
      --muted:#b9b9c7;
      --link:var(--brand);
      --ring:hsl(280 100% 70% / .6);

      --container: 1120px;
      --space-1: .5rem;
      --space-2: 1rem;
      --space-3: 1.5rem;
      --space-4: 2rem;
      --radius: 14px;
    }

    *,
    *::before,
    *::after { box-sizing:border-box; }

    html, body {
      margin:0;
      padding:0;
      width:100%;
      overflow-x:hidden;
      background:var(--bg);
      color:var(--text);
    }

    img, picture, video {
      max-width:100%;
      height:auto;
      display:block;
    }

    /* Fluid Type */
    :root {
      --step--1: clamp(.88rem, .86rem + .2vw, .98rem);
      --step-0:  clamp(1rem,  .95rem + .5vw, 1.125rem);
      --step-1:  clamp(1.25rem, 1.1rem + .9vw, 1.5rem);
      --step-2:  clamp(1.5rem,  1.3rem + 1.4vw, 2rem);
      --step-3:  clamp(1.9rem,  1.6rem + 2vw,  2.6rem);
      --step-4:  clamp(2.4rem,  2rem + 2.8vw, 3.4rem);
    }

    body {
      font: 400 var(--step-0)/1.6 system-ui, -apple-system, Segoe UI, Roboto,
        "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
    }

    h1,h2,h3 {
      line-height:1.15;
      margin:0 0 var(--space-2);
      color:var(--text);
    }
    h1 { font-size:var(--step-4); }
    h2 { font-size:var(--step-2); margin-top:var(--space-4); }
    h3 { font-size:var(--step-1); margin-top:var(--space-3); }

    p {
      margin:0 0 var(--space-2);
      color:var(--muted);
    }

    ul, ol {
      margin:0 0 var(--space-2);
      padding-left:1.5rem;
      color:var(--muted);
    }

    /* Links / buttons */
    a {
      color:var(--link);
      text-decoration:none;
    }

    a:hover {
      text-decoration:underline;
    }

    .button {
      display:inline-flex;
      align-items:center;
      gap:.6rem;
      padding:.7rem 1.1rem;
      border-radius:var(--radius);
      background:var(--brand);
      color:#111;
      font-weight:700;
      border:0;
      box-shadow:0 8px 24px rgba(237,13,146,.25);
      text-decoration:none;
    }

    .button:is(:hover,:focus-visible) {
      color:white;
      text-decoration:none;
      filter:brightness(1.08);
    }

    :focus-visible {
      color:white;
      outline:3px solid var(--ring);
      outline-offset:3px;
    }

    /* Layout helpers */
    .container {
      width:min(100% - 2rem, var(--container));
      margin-inline:auto;
    }

    .section {
      padding-block:clamp(2.5rem, 2rem + 3vw, 5rem);
    }

    /* Nav (sticky) */
    .site-nav {
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:saturate(120%) blur(6px);
      background:linear-gradient(
        to bottom,
        rgba(11,15,57,.85),
        rgba(11,15,57,.55)
      );
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .site-nav .bar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:.8rem 0;
    }

    .site-nav a {
      color:var(--text);
      opacity:.85;
      font-size:var(--step--1);
    }

    .site-nav a:hover {
      opacity:1;
    }

    .nav-links {
      display:flex;
      flex-wrap:wrap;
      gap:var(--space-2);
      align-items:center;
    }

    /* Hero banner (same look, full width) */
    .hero-bg {
      width:100%;
      aspect-ratio:16/5;
      background-image:url("https://raw.githubusercontent.com/monapdx/AbortOurCourt/refs/heads/main/images/branding/header-1920.webp");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    @media (max-width:1024px) {
      .hero-bg {
        background-image:url("https://raw.githubusercontent.com/monapdx/AbortOurCourt/refs/heads/main/images/branding/header-1024.webp");
      }
    }

    @media (max-width:600px) {
      .hero-bg {
        background-image:url("https://raw.githubusercontent.com/monapdx/AbortOurCourt/refs/heads/main/images/branding/header-600.webp");
      }
    }

    /* Content page styles (single full-width column) */
    .content-wrapper {
      padding-block:clamp(2.5rem, 2rem + 3vw, 4rem);
    }

    .content-card {
      background:var(--bg-elev);
      border-radius:var(--radius);
      padding:clamp(1.5rem, 1.2rem + 2vw, 2.5rem);
      box-shadow:0 8px 24px rgba(0,0,0,.35);
    }

    .page-meta {
      font-size:var(--step--1);
      color:var(--muted);
      margin-bottom:var(--space-2);
    }

    .content-card hr {
      border:0;
      border-top:1px solid rgba(255,255,255,.08);
      margin:var(--space-3) 0;
    }

    /* Footer */
    .footer {
      color:var(--muted);
      border-top:1px solid rgba(255,255,255,.08);
      padding-block:2rem;
    }

    .footer-inner {
      display:flex;
      flex-wrap:wrap;
      gap:var(--space-2);
      align-items:center;
      justify-content:space-between;
      font-size:var(--step--1);
    }
  </style>
</head>
