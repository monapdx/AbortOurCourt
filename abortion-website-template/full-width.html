<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abort the Supreme Court – Privacy Policy</title>

  <style>
    /* ===== Base / Reset ===== */
    :root {
      --brand:#ed0d92;
      --bg:#0b0f39;
      --bg-elev:#11122a;
      --text:#e9e9ef;
      --muted:#b9b9c7;
      --link:var(--brand);
      --ring:hsl(280 100% 70% / .6);

      --container: 1120px;
      --space-1: .5rem;
      --space-2: 1rem;
      --space-3: 1.5rem;
      --space-4: 2rem;
      --radius: 14px;
    }

    *,
    *::before,
    *::after { box-sizing:border-box; }

    html, body {
      margin:0;
      padding:0;
      width:100%;
      overflow-x:hidden;
      background:var(--bg);
      color:var(--text);
    }

    img, picture, video {
      max-width:100%;
      height:auto;
      display:block;
    }

    /* Fluid Type */
    :root {
      --step--1: clamp(.88rem, .86rem + .2vw, .98rem);
      --step-0:  clamp(1rem,  .95rem + .5vw, 1.125rem);
      --step-1:  clamp(1.25rem, 1.1rem + .9vw, 1.5rem);
      --step-2:  clamp(1.5rem,  1.3rem + 1.4vw, 2rem);
      --step-3:  clamp(1.9rem,  1.6rem + 2vw,  2.6rem);
      --step-4:  clamp(2.4rem,  2rem + 2.8vw, 3.4rem);
    }

    body {
      font: 400 var(--step-0)/1.6 system-ui, -apple-system, Segoe UI, Roboto,
        "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
    }

    h1,h2,h3 {
      line-height:1.15;
      margin:0 0 var(--space-2);
      color:var(--text);
    }
    h1 { font-size:var(--step-4); }
    h2 { font-size:var(--step-2); margin-top:var(--space-4); }
    h3 { font-size:var(--step-1); margin-top:var(--space-3); }

    p {
      margin:0 0 var(--space-2);
      color:var(--muted);
    }

    ul, ol {
      margin:0 0 var(--space-2);
      padding-left:1.5rem;
      color:var(--muted);
    }

    /* Links / buttons */
    a {
      color:var(--link);
      text-decoration:none;
    }

    a:hover {
      text-decoration:underline;
    }

    .button {
      display:inline-flex;
      align-items:center;
      gap:.6rem;
      padding:.7rem 1.1rem;
      border-radius:var(--radius);
      background:var(--brand);
      color:#111;
      font-weight:700;
      border:0;
      box-shadow:0 8px 24px rgba(237,13,146,.25);
      text-decoration:none;
    }

    .button:is(:hover,:focus-visible) {
      color:white;
      text-decoration:none;
      filter:brightness(1.08);
    }

    :focus-visible {
      color:white;
      outline:3px solid var(--ring);
      outline-offset:3px;
    }

    /* Layout helpers */
    .container {
      width:min(100% - 2rem, var(--container));
      margin-inline:auto;
    }

    .section {
      padding-block:clamp(2.5rem, 2rem + 3vw, 5rem);
    }

    /* Nav (sticky) */
    .site-nav {
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:saturate(120%) blur(6px);
      background:linear-gradient(
        to bottom,
        rgba(11,15,57,.85),
        rgba(11,15,57,.55)
      );
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .site-nav .bar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:.8rem 0;
    }

    .site-nav a {
      color:var(--text);
      opacity:.85;
      font-size:var(--step--1);
    }

    .site-nav a:hover {
      opacity:1;
    }

    .nav-links {
      display:flex;
      flex-wrap:wrap;
      gap:var(--space-2);
      align-items:center;
    }

    /* Hero banner (same look, full width) */
    .hero-bg {
      width:100%;
      aspect-ratio:16/5;
      background-image:url("https://raw.githubusercontent.com/monapdx/AbortOurCourt/refs/heads/main/images/branding/header-1920.webp");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    @media (max-width:1024px) {
      .hero-bg {
        background-image:url("https://raw.githubusercontent.com/monapdx/AbortOurCourt/refs/heads/main/images/branding/header-1024.webp");
      }
    }

    @media (max-width:600px) {
      .hero-bg {
        background-image:url("https://raw.githubusercontent.com/monapdx/AbortOurCourt/refs/heads/main/images/branding/header-600.webp");
      }
    }

    /* Content page styles (single full-width column) */
    .content-wrapper {
      padding-block:clamp(2.5rem, 2rem + 3vw, 4rem);
    }

    .content-card {
      background:var(--bg-elev);
      border-radius:var(--radius);
      padding:clamp(1.5rem, 1.2rem + 2vw, 2.5rem);
      box-shadow:0 8px 24px rgba(0,0,0,.35);
    }

    .page-meta {
      font-size:var(--step--1);
      color:var(--muted);
      margin-bottom:var(--space-2);
    }

    .content-card hr {
      border:0;
      border-top:1px solid rgba(255,255,255,.08);
      margin:var(--space-3) 0;
    }

    /* Footer */
    .footer {
      color:var(--muted);
      border-top:1px solid rgba(255,255,255,.08);
      padding-block:2rem;
    }

    .footer-inner {
      display:flex;
      flex-wrap:wrap;
      gap:var(--space-2);
      align-items:center;
      justify-content:space-between;
      font-size:var(--step--1);
    }
  /* Shared header and navigation */
.site-nav { backdrop-filter: none; }
.site-nav a { opacity: 1; }
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #ffffff;
      border-bottom: 4px solid #111111;
    }

    .site-nav .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
    }

    .site-nav .site-logo {
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      padding: .75rem 1rem;
      background: #e69dfc;
      border: 4px solid #111111;
      box-shadow: 4px 4px 0 #111111;
      font-family: Arial Black, Impact, sans-serif;
      font-size: .92rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .site-nav .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
    }

    .site-nav .nav-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: .7rem 1rem;
      background: #ffffff;
      border: 4px solid #111111;
      box-shadow: 4px 4px 0 #111111;
      font-size: .85rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .site-nav .nav-links a:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #111111;
    }

    .site-nav .nav-links a:active {
      transform: translate(6px, 6px);
      box-shadow: none;
    }


    .site-nav { color: #111111; font-family: Inter, Arial, Helvetica, sans-serif; line-height: 1.65; }
    .site-nav .container { width: min(100% - 2rem, 980px); }
    .site-nav a { color: #111111; text-decoration: none; }
    .site-nav .nav-links a:hover,
    .site-nav .nav-links a:focus-visible { background-color: #e69dfc; }
    .site-nav a:focus-visible { color: #111111; outline: 3px solid #ed0d92; outline-offset: 3px; }
    @media (max-width: 700px) {
      .site-nav .bar { flex-direction: column; align-items: stretch; }
      .site-nav .site-logo { justify-content: center; }
      .site-nav .nav-links { width: 100%; }
      .site-nav .nav-links a { width: 100%; }
    }


</style>
</head>
<body>
  <!-- Header / nav -->
  <header class="site-nav">
    <div class="container bar">
      <a href="/index.html" class="site-logo">
        <strong>Abort the Supreme Court</strong>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="/index.html">Home</a>
        <a href="/about.html">About</a>
        <a href="/posts.html">Blog</a>
        <a href="/toolkits.html">Toolkits</a>
        <a href="/index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Hero image (same banner) -->
  <div class="hero-bg" role="img" aria-label="Abort the Supreme Court logo banner"></div>

  <!-- Main content: single-column, full-width template -->
  <main>
    <section class="content-wrapper">
      <div class="container">
        <article class="content-card">

        </article>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <small>© 2025 Abort the Supreme Court</small>
      <small>
        <a href="/privacy.html">Privacy Policy</a>
      </small>
    </div>
  </footer>
  

</body>
</html>
